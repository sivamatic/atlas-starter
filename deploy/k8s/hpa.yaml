# Needs metrics-server in the cluster (kind and minikube: see README).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas
  labels:
    app.kubernetes.io/name: atlas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
