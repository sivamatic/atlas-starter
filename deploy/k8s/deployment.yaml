apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas
  labels:
    app.kubernetes.io/name: atlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atlas
          image: atlas:solved           # kind load docker-image atlas:solved, or your registry path
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: atlas-config
            - secretRef:
                name: atlas-secrets
          # The process is up: restart it if this fails. Checks nothing external on purpose.
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Ready for traffic: adapter configured, budget left, knowledge base loaded.
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var
              mountPath: /app/var
      volumes:
        - name: tmp
          emptyDir: {}
        - name: var
          emptyDir: {}
