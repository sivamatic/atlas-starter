# An EXAMPLE. Do not commit real values. Create the real one from your shell instead:
#   kubectl create secret generic atlas-secrets \
#     --from-literal=LLM_API_KEY=... --from-literal=ATLAS_DB_URL=postgresql://...
# Leave ATLAS_DB_URL empty to use the in-memory store (data is lost when the pod restarts).
apiVersion: v1
kind: Secret
metadata:
  name: atlas-secrets
  labels:
    app.kubernetes.io/name: atlas
type: Opaque
stringData:
  LLM_API_KEY: ""
  ATLAS_DB_URL: ""
  # OTEL_EXPORTER_OTLP_ENDPOINT: "https://cloud.langfuse.com/api/public/otel"
  # OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic%20<base64 of public_key:secret_key>,x-langfuse-ingestion-version=4"
