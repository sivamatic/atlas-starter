[pytest]
testpaths = tests
pythonpath = .
markers =
    week0: Hello Atlas (Unit 0 project)
    week3: Cited answers from permission-aware hybrid retrieval (Unit 3 project)
    week4: Evals, a reranker and a merge gate (Unit 4)
    week5: Approved, idempotent tickets with an audit trail (Units 4-5)
    week6: Tracing, metrics and operations (Unit 6)
    deploy: container and Kubernetes files are well formed
    pg: runs against a real Postgres + pgvector (needs ATLAS_TEST_PG_URL)
