name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyyaml
      - name: Starter fails, solutions pass
        run: python tools/check_starter.py
      - name: Eval gate on the solved build (default dataset and every example)
        run: |
          python tools/apply_solutions.py "$RUNNER_TEMP/solved"
          cd "$RUNNER_TEMP/solved"
          python tools/eval_gate.py --compare
          for d in examples/*/; do python tools/eval_gate.py --data-dir "examples/$(basename "$d")"; done
